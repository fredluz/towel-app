name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run typecheck

  voice:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path voice
