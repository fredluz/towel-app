name: CI

on:
  push:
  pull_request:

jobs:
  codex-live:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun test
      - run: bun run typecheck
      - run: bun run smoke:imports
